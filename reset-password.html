<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>FoodFriends - Nouveau mot de passe</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8f6f4;min-height:100vh;display:flex;flex-direction:column;color:#1a1a1a}
    .header{background:#FF6B35;padding:24px 24px 28px;text-align:center}
    .header h1{color:#fff;font-size:24px;font-weight:900;letter-spacing:-0.5px}
    .content{flex:1;display:flex;flex-direction:column;align-items:center;padding:40px 16px;max-width:480px;margin:0 auto;width:100%}
    .card{background:#fff;border-radius:20px;padding:28px 22px;width:100%;box-shadow:0 3px 10px rgba(0,0,0,0.1)}
    .card h2{font-size:20px;font-weight:800;margin-bottom:10px;text-align:center}
    .card p{font-size:15px;color:#666;line-height:1.5;margin-bottom:20px;text-align:center}
    label{display:block;font-size:13px;font-weight:700;color:#777;margin:14px 0 6px}
    input{width:100%;font-size:16px;padding:14px 52px 14px 16px;border:1.5px solid #e5e0dc;border-radius:14px;background:#fff;outline:none}
    .pw{position:relative}
    .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:transparent;font-size:20px;cursor:pointer;border-radius:10px;opacity:.55}
    .eye[aria-pressed="true"]{opacity:1}
    input:focus{border-color:#FF6B35}
    .btn{display:block;width:100%;margin-top:22px;background:#FF6B35;color:#fff;font-size:16px;font-weight:800;padding:16px;border:0;border-radius:16px;cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 16px rgba(255,107,53,0.35)}
    .btn[disabled]{opacity:.6;cursor:default}
    .error{color:#c62828;font-size:14px;font-weight:600;margin-top:14px;text-align:center;min-height:1em}
    .icon{font-size:56px;text-align:center;margin-bottom:12px}
    .hidden{display:none}
    .footer{text-align:center;padding:24px;color:#aaa;font-size:12px}
  </style>
</head>
<body>
  <div class="header"><h1>FoodFriends</h1></div>
  <div class="content">
    <!-- Chargement : lecture du lien reçu par mail -->
    <div class="card" id="loading">
      <p data-fr="Vérification du lien…" data-en="Checking your link…"></p>
    </div>

    <!-- Formulaire : nouveau mot de passe -->
    <form class="card hidden" id="form" novalidate>
      <div class="icon">🔑</div>
      <h2 data-fr="Choisis un nouveau mot de passe" data-en="Choose a new password"></h2>
      <p data-fr="8 caractères minimum." data-en="At least 8 characters."></p>
      <label for="pw1" data-fr="Nouveau mot de passe" data-en="New password"></label>
      <div class="pw">
        <input id="pw1" type="password" autocomplete="new-password" minlength="8" required>
        <button type="button" class="eye" data-for="pw1" aria-pressed="false">👁</button>
      </div>
      <label for="pw2" data-fr="Confirme le mot de passe" data-en="Confirm the password"></label>
      <div class="pw">
        <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
        <button type="button" class="eye" data-for="pw2" aria-pressed="false">👁</button>
      </div>
      <button class="btn" id="submit" type="submit" data-fr="Enregistrer" data-en="Save"></button>
      <div class="error" id="formError" role="alert"></div>
    </form>

    <!-- Terminé -->
    <div class="card hidden" id="done">
      <div class="icon">✅</div>
      <h2 data-fr="Mot de passe modifié !" data-en="Password changed!"></h2>
      <p data-fr="Retourne dans l'appli FoodFriends et connecte-toi avec ton nouveau mot de passe." data-en="Go back to the FoodFriends app and sign in with your new password."></p>
      <a href="foodfriends://" class="btn" data-fr="Ouvrir FoodFriends" data-en="Open FoodFriends"></a>
    </div>

    <!-- Lien invalide ou expiré -->
    <div class="card hidden" id="invalid">
      <div class="icon">⏳</div>
      <h2 data-fr="Ce lien n'est plus valable" data-en="This link is no longer valid"></h2>
      <p data-fr="Il a expiré ou a déjà servi. Dans l'appli, touche « Mot de passe oublié ? » pour recevoir un nouveau lien." data-en="It has expired or was already used. In the app, tap “Forgot password?” to get a new link."></p>
      <a href="foodfriends://" class="btn" data-fr="Ouvrir FoodFriends" data-en="Open FoodFriends"></a>
    </div>
  </div>
  <div class="footer">&copy; 2026 FoodFriends</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.0/dist/umd/supabase.js"></script>
  <script>
    // Page ouverte depuis le mail « Mot de passe oublié » (lien Supabase, type=recovery).
    // Le lien ouvre une session temporaire de récupération ; on s'en sert pour enregistrer le
    // nouveau mot de passe, puis on ferme la session (la personne se reconnecte dans l'appli).
    var EN = (navigator.language || '').toLowerCase().indexOf('en') === 0;
    document.documentElement.lang = EN ? 'en' : 'fr';
    document.querySelectorAll('[data-fr]').forEach(function (el) {
      el.textContent = EN ? el.getAttribute('data-en') : el.getAttribute('data-fr');
    });
    var T = function (fr, en) { return EN ? en : fr; };

    // Œil : afficher / masquer le mot de passe
    document.querySelectorAll('.eye').forEach(function (b) {
      var input = document.getElementById(b.getAttribute('data-for'));
      var label = function () { b.setAttribute('aria-label', input.type === 'password' ? T('Afficher le mot de passe', 'Show password') : T('Masquer le mot de passe', 'Hide password')); };
      label();
      b.addEventListener('click', function () {
        input.type = input.type === 'password' ? 'text' : 'password';
        b.setAttribute('aria-pressed', String(input.type === 'text'));
        label();
        input.focus();
      });
    });
    var show = function (id) {
      ['loading', 'form', 'done', 'invalid'].forEach(function (x) {
        document.getElementById(x).classList.toggle('hidden', x !== id);
      });
    };

    // Clé publique de l'appli (la même que dans lib/supabase.ts, faite pour être publique)
    var client = window.supabase.createClient(
      'https://ejhfpcegfjtkbqgbblnh.supabase.co',
      'sb_publishable_81a3e7rnLCksz5_aBee0pQ_B08V5qSj',
      { auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: false, autoRefreshToken: false } }
    );

    var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
    var query = new URLSearchParams(location.search);
    var hasError = hash.get('error') || query.get('error');
    var hasToken = hash.get('access_token') && hash.get('type') === 'recovery';
    var decided = false;

    if (hasError || !hasToken) {
      show('invalid');
      decided = true;
    }

    client.auth.onAuthStateChange(function (event, session) {
      if (decided) return;
      if ((event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session) {
        decided = true;
        history.replaceState(null, '', location.pathname); // retire le jeton de la barre d'adresse
        show('form');
        document.getElementById('pw1').focus();
      }
    });
    // Filet : si rien n'est arrivé au bout de 8 s, le lien n'a pas ouvert de session
    setTimeout(function () { if (!decided) { decided = true; show('invalid'); } }, 8000);

    document.getElementById('form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var pw1 = document.getElementById('pw1').value;
      var pw2 = document.getElementById('pw2').value;
      var err = document.getElementById('formError');
      var btn = document.getElementById('submit');
      err.textContent = '';
      if (pw1.length < 8) { err.textContent = T('Le mot de passe doit contenir au moins 8 caractères.', 'The password must be at least 8 characters.'); return; }
      if (pw1 !== pw2) { err.textContent = T('Les deux mots de passe ne sont pas identiques.', 'The two passwords do not match.'); return; }
      btn.disabled = true;
      btn.textContent = T('Enregistrement…', 'Saving…');
      try {
        var res = await client.auth.updateUser({ password: pw1 });
        if (res.error) throw res.error;
        await client.auth.signOut({ scope: 'local' });
        show('done');
      } catch (ex) {
        var msg = String((ex && ex.message) || '').toLowerCase();
        err.textContent = msg.indexOf('different from the old') >= 0 || msg.indexOf('same') >= 0
          ? T('Choisis un mot de passe différent de l\'ancien.', 'Choose a password different from the old one.')
          : msg.indexOf('weak') >= 0 || msg.indexOf('characters') >= 0
            ? T('Mot de passe trop faible : ajoute des lettres et des chiffres.', 'Password too weak: add letters and numbers.')
            : msg.indexOf('expired') >= 0 || msg.indexOf('session') >= 0
              ? T('Le lien a expiré. Redemande un lien depuis l\'appli.', 'The link has expired. Request a new one from the app.')
              : T('Connexion perdue, réessaie.', 'Connection lost, try again.');
        btn.disabled = false;
        btn.textContent = T('Enregistrer', 'Save');
      }
    });
  </script>
</body>
</html>
